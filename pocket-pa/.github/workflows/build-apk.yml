name: Instant Mic Android checks
on:
  push:
    branches: [main, bluetooth-mic-app]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleDebug :app:bundleRelease
      - name: Upload installable test APK and unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: Instant-Mic-test-APK-and-unsigned-AAB
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
