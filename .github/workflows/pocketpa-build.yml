name: Instant Mic 2.2 - APK and Play Bundle
on:
  push:
    branches: [bluetooth-mic-app]
    paths:
      - 'pocket-pa/**'
      - '.github/workflows/pocketpa-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pocket-pa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run PCM audio processor smoke tests
        run: |
          mkdir -p /tmp/pocketpa-tests
          javac -d /tmp/pocketpa-tests app/src/main/java/com/niru/pocketpa/AudioProcessor.java tests/AudioProcessorSmokeTest.java
          java -cp /tmp/pocketpa-tests com.niru.pocketpa.AudioProcessorSmokeTest
      - name: Restore optional release signing key
        env:
          UPLOAD_KEY_B64: ${{ secrets.POCKETPA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEY_B64" ]; then
            printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/pocket-pa/upload-key.jks"
          fi
      - name: Build installable APK and Play bundle
        env:
          POCKETPA_KEYSTORE_FILE: ${{ github.workspace }}/pocket-pa/upload-key.jks
          POCKETPA_KEYSTORE_PASSWORD: ${{ secrets.POCKETPA_KEYSTORE_PASSWORD }}
          POCKETPA_KEY_ALIAS: ${{ secrets.POCKETPA_KEY_ALIAS }}
          POCKETPA_KEY_PASSWORD: ${{ secrets.POCKETPA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Package release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InstantMic-v2.2-debug.apk
          if [ -f upload-key.jks ]; then
            cp app/build/outputs/bundle/release/app-release.aab InstantMic-v2.2-signed-release.aab
          else
            cp app/build/outputs/bundle/release/app-release.aab InstantMic-v2.2-UNSIGNED-release.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: InstantMic-v2.2-Debug-APK
          path: pocket-pa/InstantMic-v2.2-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: InstantMic-v2.2-Play-Bundle
          path: pocket-pa/InstantMic-v2.2-*.aab
          if-no-files-found: error
          retention-days: 30
