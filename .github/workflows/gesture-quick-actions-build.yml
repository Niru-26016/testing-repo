name: Build Gesture Quick Actions APK

on:
  push:
    branches:
      - gesture-quick-actions-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify project source
        run: |
          cat gqa/chunk-01.b64 gqa/chunk-02.b64 gqa/chunk-03.b64 gqa/chunk-04.b64 gqa/chunk-05.b64 > source.b64
          test "$(wc -c < source.b64)" -eq 26996
          base64 -d source.b64 > gesture-quick-actions-source.zip
          echo "74c36d8917cc845c20436e34d588e10e7086e3d9f14c54c8e927bae11a1920b2  gesture-quick-actions-source.zip" | sha256sum -c -
          mkdir -p extracted
          unzip -q gesture-quick-actions-source.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/GestureQuickActions
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f extracted/GestureQuickActions/app/build/outputs/apk/debug/app-debug.apk
          sha256sum extracted/GestureQuickActions/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureQuickActions-APK
          path: extracted/GestureQuickActions/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
